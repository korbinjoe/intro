<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#131617">
  <title>Korbin Joe</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.svg">
  <meta name="description" content="Korbin Joe (@korbinjoe) — Agent engineer. XShot | Parrot | LPlayer | Desk Angler | toools.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
  :root {
    /* Burnished copper on graphite: one warm accent, dry opaque surfaces. */
    color-scheme: dark;
    --bg: #131617;
    --surface: #1b1e1f;
    --surface-elevated: #262a2b;
    --surface-hover: #342c27;
    --border: #414441;
    --border-faint: #303534;
    --border-active: #a2785e;
    --text: #e7e4dc;
    --muted: #aaa69d;
    --prompt-user: var(--accent);
    --prompt-host: #c4c0b5;
    --prompt-path: #bc9d87;
    --prompt-symbol: var(--muted);
    --cmd: #e5c3a9;
    --output: #d4d2c9;
    --accent: #d29a78;
    --link: var(--accent);
    --link-hover: #edbd9e;
    --error: #e0a18f;
    --selection: #654934;
    --selection-text: #fff0df;
    --scrollbar: #857568;
    --mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
    --radius: 10px;
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html {
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    scrollbar-color: var(--scrollbar) var(--bg);
    scrollbar-width: thin;
  }

  ::selection {
    background: var(--selection);
    color: var(--selection-text);
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb {
    background: var(--scrollbar);
    border: 2px solid var(--bg);
    border-radius: 5px;
  }

  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    line-height: 1.65;
    padding: clamp(0.85rem, 3.5vw, 2.25rem);
  }

  .shell {
    position: relative;
    min-height: calc(100dvh - clamp(1.7rem, 7vw, 4.5rem));
    display: flex;
    flex-direction: column;
    max-width: min(56rem, 100%);
    margin: 0 auto;
    padding: clamp(1.35rem, 4vw, 2.25rem);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    transition: border-color 0.25s ease;
  }

  .shell:focus-within {
    border-color: var(--border-active);
  }

  .shell::before,
  .shell::after {
    content: "";
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: var(--border-active);
    border-style: solid;
    pointer-events: none;
  }

  .shell::before {
    top: 12px;
    left: 12px;
    border-width: 1px 0 0 1px;
  }

  .shell::after {
    right: 12px;
    bottom: 12px;
    border-width: 0 1px 1px 0;
  }

  .banner {
    position: relative;
    color: var(--muted);
    font-size: clamp(0.78rem, 2.2vw, 0.88rem);
    margin-bottom: 1.85rem;
    white-space: pre-line;
    border-bottom: 1px solid var(--border-faint);
    padding-bottom: 1.1rem;
    letter-spacing: 0.05em;
  }

  .banner::after {
    content: "";
    position: absolute;
    bottom: -1px;
    left: 0;
    width: 3rem;
    height: 2px;
    background: var(--accent);
  }

  .banner em {
    color: var(--accent);
    font-style: normal;
    font-weight: 500;
  }

  #history {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 0.45rem;
    font-size: clamp(0.875rem, 2.4vw, 0.95rem);
  }

  .entry {
    animation: fade-in 0.22s ease-out;
  }

  .prompt-line {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    word-break: break-word;
    overflow-wrap: anywhere;
  }

  .prompt-line .user { color: var(--prompt-user); font-weight: 500; }
  .prompt-line .at,
  .prompt-line .symbol { color: var(--prompt-symbol); }
  .prompt-line .host { color: var(--prompt-host); }
  .prompt-line .path { color: var(--prompt-path); }
  .prompt-line .cmd { color: var(--cmd); margin-left: 0.4rem; font-weight: 500; }

  .output {
    color: var(--output);
    white-space: pre-wrap;
    word-break: break-word;
    overflow-wrap: anywhere;
    padding: 0.2rem 0 0.15rem;
    margin: 0.2rem 0 0.8rem;
    border-left: 2px solid transparent;
  }

  .output.muted { color: var(--muted); }
  .output.success { color: var(--prompt-host); }

  .output a {
    color: var(--link);
    text-decoration: none;
    border-bottom: 1px dashed var(--border-active);
    transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
    border-radius: 2px;
  }

  .output a:hover {
    color: var(--link-hover);
    border-bottom-color: var(--link-hover);
    border-bottom-style: solid;
    background: var(--surface-hover);
  }

  .output a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .input-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 0.65rem;
    padding-top: 0.95rem;
    border-top: 1px solid var(--border-faint);
    font-size: clamp(0.875rem, 2.4vw, 0.95rem);
    gap: 0.15rem 0;
  }

  .input-row input {
    flex: 1;
    min-width: 10rem;
    background: transparent;
    border: none;
    outline: none;
    color: var(--cmd);
    font: inherit;
    caret-color: var(--accent);
    padding: 0.15rem 0;
    margin-left: 0.4rem;
  }

  .input-row input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1.05em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 1s step-end infinite;
  }

  .cursor.off { opacity: 0; animation: none; }

  .hint {
    margin-top: 1.4rem;
    font-size: clamp(0.72rem, 2vw, 0.8rem);
    color: var(--muted);
    letter-spacing: 0.03em;
    line-height: 1.8;
  }

  .hint kbd {
    color: var(--text);
    background: var(--surface-elevated);
    border: 1px solid var(--border-faint);
    border-radius: 4px;
    padding: 0.12rem 0.42rem;
    font: inherit;
    margin-right: 0.2rem;
    transition: border-color 0.2s ease, background-color 0.2s ease, color 0.2s ease;
  }

  .hint kbd:hover {
    border-color: var(--border-active);
    background: var(--surface-hover);
    color: var(--accent);
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  @keyframes fade-in {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 640px) {
    body { padding: 0.65rem; }
    .shell {
      min-height: calc(100dvh - 1.3rem);
      padding: 1.1rem 1rem 1.25rem;
      border-radius: 8px;
    }
    .banner { margin-bottom: 1.25rem; }
    .hint { margin-top: 1.1rem; }
    .input-row input { min-width: 7rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .entry { animation: none; }
    .cursor { animation: none; }
    .shell, .output a, .hint kbd { transition: none; }
  }
</style>
</head>

<body>
  <div class="shell">
    <p class="banner" aria-hidden="true">korbin-joe shell v1.0.0
Agent engineer · Type <em>help</em> for commands · <em>clear</em> to reset</p>

    <div id="history" aria-live="polite" aria-label="Terminal output"></div>

    <form class="input-row" id="form" autocomplete="off">
      <label class="prompt-line" for="input" id="prompt-label">
        <span class="user">korbin</span><span class="at">@</span><span class="host">intro</span>
        <span class="symbol">:</span><span class="path">~</span><span class="symbol">$</span>
      </label>
      <input id="input" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="Terminal command input">
    </form>

    <p class="hint">Try: <kbd>help</kbd> <kbd>whoami</kbd> <kbd>about</kbd> <kbd>projects</kbd> <kbd>links</kbd> <kbd>contact</kbd></p>
  </div>

  <script>
  const DATA = {
    name: "Korbin Joe",
    slug: "@korbinjoe",
    about: "Hi, I am Korbin Joe (@korbinjoe).\nAgent engineer. XShot | Parrot | LPlayer | Desk Angler | toools.",
    projects: [
      { name: "XShot", url: "https://github.com/korbinjoe/xshot", desc: "An independently implemented native macOS screenshot tool with annotations, beautification, and pinned images." },
      { name: "Parrot", url: "https://github.com/korbinjoe/parrot", desc: "Open-source macOS & iOS translation, OCR, and multi-engine aggregator with plugin support." },
      { name: "LPlayer", url: "https://github.com/korbinjoe/LPlayer", desc: "A local video player for macOS, built with AppKit and libmpv." },
      { name: "Desk Angler", url: "https://github.com/korbinjoe/desk-angler", desc: "A lightweight native macOS seaside wallpaper with playable fishing breaks and local AI work rewards." },
      { name: "toools", url: "https://github.com/korbinjoe/toools", desc: "An amazing toools zone — GitHub Awesome lists, Product Hunt launches, maintainer picks, and community submissions. https://toools.top" },
    ],
    links: [
      { name: "github", url: "https://github.com/korbinjoe", label: "Github" },
      { name: "twitter", url: "https://twitter.com/korbinjoe", label: "Twitter" },
    ],
    email: "1031700027@qq.com",
  };

  const history = document.getElementById("history");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const typeSpeed = reducedMotion ? 0 : 38;
  const lineDelay = reducedMotion ? 0 : 320;

  const bootSequence = [
    { cmd: "whoami", run: () => DATA.slug },
    { cmd: "cat about.txt", run: () => DATA.about },
    { cmd: "projects --active", run: () => formatProjects() },
    { cmd: "links --list", run: () => formatLinks() },
    { cmd: "contact", run: () => DATA.email },
  ];

  function promptHtml() {
    return `<span class="user">korbin</span><span class="at">@</span><span class="host">intro</span><span class="symbol">:</span><span class="path">~</span><span class="symbol">$</span>`;
  }

  function formatProjects() {
    const pad = Math.max(...DATA.projects.map((p) => p.name.length)) + 2;
    return DATA.projects
      .map((p) => `${p.name.padEnd(pad)} ${p.desc}\n${"".padEnd(pad)} ${p.url}`)
      .join("\n\n");
  }

  function formatProjectsHtml() {
    const pad = Math.max(...DATA.projects.map((p) => p.name.length)) + 2;
    return DATA.projects
      .map((p) => `${p.name.padEnd(pad)} ${p.desc}\n${"".padEnd(pad)} <a href="${p.url}" target="_blank" rel="noopener noreferrer">${p.url}</a>`)
      .join("\n\n");
  }

  function formatLinks() {
    const pad = Math.max(...DATA.links.map((l) => l.name.length)) + 2;
    return DATA.links
      .map((l) => `${l.name.padEnd(pad)} ${l.url}`)
      .join("\n");
  }

  function formatLinksHtml() {
    const pad = Math.max(...DATA.links.map((l) => l.name.length)) + 2;
    return DATA.links
      .map((l) => `${l.name.padEnd(pad)} <a href="${l.url}" target="_blank" rel="noopener noreferrer">${l.url}</a>`)
      .join("\n");
  }

  function scrollBottom() {
    window.scrollTo({ top: document.body.scrollHeight, behavior: reducedMotion ? "auto" : "smooth" });
  }

  function sleep(ms) {
    return new Promise((resolve) => setTimeout(resolve, ms));
  }

  function addEntry(html, className = "entry") {
    const el = document.createElement("div");
    el.className = className;
    el.innerHTML = html;
    history.appendChild(el);
    scrollBottom();
    return el;
  }

  async function typeText(el, text, speed = typeSpeed) {
    if (speed === 0) {
      el.textContent = text;
      return;
    }
    for (const char of text) {
      el.textContent += char;
      scrollBottom();
      await sleep(speed + Math.random() * 18);
    }
  }

  async function runCommand(cmd, outputFn, { interactive = false, htmlOutput = null } = {}) {
    const entry = addEntry("");
    const promptLine = document.createElement("div");
    promptLine.className = "prompt-line";
    promptLine.innerHTML = promptHtml();

    const cmdSpan = document.createElement("span");
    cmdSpan.className = "cmd";
    promptLine.appendChild(cmdSpan);
    entry.appendChild(promptLine);

    if (interactive) {
      cmdSpan.textContent = cmd;
    } else {
      await typeText(cmdSpan, cmd);
      await sleep(lineDelay);
    }

    const raw = outputFn();
    if (raw === null || raw === undefined) return;

    const out = document.createElement("pre");
    out.className = "output";
    entry.appendChild(out);

    if (htmlOutput) {
      out.innerHTML = htmlOutput;
    } else if (interactive || reducedMotion) {
      out.textContent = raw;
    } else {
      await typeText(out, raw, 12);
    }

    scrollBottom();
  }

  function execute(cmd) {
    const c = cmd.trim().toLowerCase();

    if (!c) return null;

    if (c === "clear") {
      history.innerHTML = "";
      return null;
    }

    if (c === "help") {
      return [
        "Available commands:",
        "  whoami        Show X handle",
        "  about         Agent engineer bio",
        "  projects      XShot, Parrot, LPlayer, Desk Angler & toools",
        "  links         Social profiles",
        "  contact       Email address",
        "  clear         Clear terminal",
        "  help          Show this message",
      ].join("\n");
    }

    if (c === "whoami") return DATA.slug;
    if (c === "about" || c === "cat about.txt") return DATA.about;
    if (c === "projects" || c === "projects --active") return { text: formatProjects(), html: formatProjectsHtml() };
    if (c === "links" || c === "links --list") return { text: formatLinks(), html: formatLinksHtml() };
    if (c === "contact") return { text: DATA.email, html: `<a href="mailto:${DATA.email}">${DATA.email}</a>` };

    return { error: true, text: `command not found: ${cmd}\nTry 'help' for available commands.` };
  }

  async function handleInput(raw) {
    const result = execute(raw);

    if (result === null) {
      if (raw.trim().toLowerCase() === "clear") return;
      return;
    }

    const entry = addEntry("");
    entry.innerHTML = `
      <div class="prompt-line">${promptHtml()}<span class="cmd">${escapeHtml(raw)}</span></div>
    `;

    const out = document.createElement("pre");
    out.className = "output";

    if (result.error) {
      out.classList.add("muted");
      out.textContent = result.text;
    } else if (result.html) {
      out.innerHTML = result.html;
    } else if (typeof result === "object" && result.text) {
      out.textContent = result.text;
    } else {
      out.textContent = result;
    }

    entry.appendChild(out);
    scrollBottom();
  }

  function escapeHtml(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  async function boot() {
    input.disabled = true;

    for (const step of bootSequence) {
      await runCommand(step.cmd, step.run, {
        htmlOutput: step.cmd.startsWith("links")
          ? formatLinksHtml()
          : step.cmd.startsWith("projects")
            ? formatProjectsHtml()
            : step.cmd === "contact"
              ? `<a href="mailto:${DATA.email}">${DATA.email}</a>`
              : null,
      });
      await sleep(reducedMotion ? 0 : 480);
    }

    input.disabled = false;
    input.focus();
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const value = input.value;
    input.value = "";
    handleInput(value);
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "l" && e.ctrlKey) {
      e.preventDefault();
      history.innerHTML = "";
    }
  });

  boot();
  </script>
</body>

</html>
